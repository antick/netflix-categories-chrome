name: Bug report
description: Report a problem with the extension
body:
  - type: markdown
    attributes:
      value: This project is unofficial and not affiliated with Netflix. Do not include credentials, cookies, personal settings exports, or account screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Popup
        - Search
        - Category data
        - Retained experimental source (not in store build)
        - Options
        - Other
    validations:
      required: true
