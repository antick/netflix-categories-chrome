name: CI landing

on:
  push:
    branches: [main]
    paths: &landing-paths
      - "apps/landing/**"
      - "apps/extension/public/icons/**"
      - "packages/**"
      - "PRIVACY.md"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "biome.json"
      - "vercel.json"
      - ".github/workflows/ci-landing.yml"
  pull_request:
    paths: *landing-paths

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run validate:data
      - run: bun run check
      - run: bun run typecheck --filter=@netflix-categories/landing
      # Builds the site, then checks the static output.
      - run: bun run test --filter=@netflix-categories/landing
