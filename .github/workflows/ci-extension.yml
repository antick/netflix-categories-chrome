name: CI extension

on:
  push:
    branches: [main]
    paths: &extension-paths
      - "apps/extension/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "biome.json"
      - "LICENSE"
      - ".github/workflows/ci-extension.yml"
  pull_request:
    paths: *extension-paths

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run validate:data
      - run: bun run check
      - run: bun run typecheck --filter=netflix-categories-chrome
      - run: bun run test --filter=netflix-categories-chrome
      - run: bun run build:extension
      - run: bun run validate:release
