<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories for Netflix promotional tile</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { background: #201c27; color: #fff8f2; font-family: Arial, sans-serif; }
  main { height: 100%; display: flex; align-items: center; gap: 24px; padding: 36px; border-bottom: 8px solid #e50914; }
  img { width: 96px; height: 96px; flex: none; }
  .label { color: #ff8790; font-size: 11px; font-weight: 700; letter-spacing: 2px; margin: 0 0 14px; }
  h1 { font-size: 31px; line-height: 1.12; letter-spacing: -1px; margin: 0; }
  .caption { margin: 16px 0 0; color: #c8c0cf; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <img src="icon-128.png" alt="Category search icon">
  <div>
    <p class="label">UNOFFICIAL</p>
    <h1>Categories<br>for Netflix</h1>
    <p class="caption">Find genres. Save favorites.</p>
  </div>
</main>
</body>
</html>
